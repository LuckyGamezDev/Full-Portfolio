<!DOCTYPE html>
<html>
    <head>
        <title>Card Grid Layout</title>

        <style>
            /* No idea what this does */
            html {
                box-sizing: border-box;
            }

            /* No idea what these do either, but it improved my situation */
            *,
            *:before,
            *:after {
                margin: 0;
                padding: 0;
                box-sizing: inherit;
            }

            body {
                background-color: rgb(204, 220, 238);
            }

            .card-container {
                display: grid;

                /* Make the grid have a max of 2 items in 1 row */
                grid-template-columns: auto auto; 

                background-color: rgb(101, 199, 175);

                justify-content: center;

                justify-self: center;

                border-radius: 30px;

                padding: 20px;
            }

            .card {
                margin: 30px;

                padding: 10px 10px;

                justify-self: center;

                background-color: blue;
            }

            .card-content {
                height: 100%;

                display: flex;
                
                flex-direction: column;

                position: relative;

                background-color: blueviolet;
            }

            .card-top {
                display: flex;

                position: absolute;

                justify-content: space-between;
            }

            .card-bottom {
                display: flex;

                justify-content: space-between;

                align-content: center;
            }

            .bg-image {
                height: 100%;
                object-fit: cover;
                vertical-align: middle;
            }
            
            .card-container img {
                background-color: rgb(146, 191, 230);
                padding: 10px;        

                transition: all 0.3s cubic-bezier(0.25, 0.45, 0.45, 0.95);

                border-radius: 25px;
                overflow: hidden;
            }

            .card-container img:hover {
                background-color: pink;
                transform: scale(1.02)
            }
        </style>
    </head>

    <body>
        <h1>Cards</h1>

        <div class="card-container">
            <div class="card">
                <div class="card-content">
                    <div class="card-bg">
                        <a href="#", class="card-link">
                            <img class="bg-image", src="sources/LuckyGamez_Portfolio_Banner.png", alt="layout card", style="width: 640px; height: 285;"></img>
                        </a>
                    </div>

                    <div class="card-top">
