<!DOCTYPE html>

<html>
    <head>
        <title>The Gaming Buddies - Submission Form</title>
        <style>
            
            body {
                background-color: rgba(140, 40, 40, 0.822);
            }

            .submission {
                margin: 15px;
            }

            input {
                border-style: solid;
                border-radius: 2px;
                border-color: black;
                border-width: 1px;
            }
        </style>
    </head>
    <body>
        <div class="submission">
            <h1>Submission Form</h1>
            <form id="submission-form">
                <label for="first-name">First Name: </label><br>
                <input type="text" id="first-name" name="first-name"><br><br>

                <label for="last-name">Last Name: </label><br>
                <input type="text" id="last-name" name="last-name"><br><br>

                <label for="user-email">Email: </label><br>
                <input inputmode="email" id="user-email" name="user-email"><br><br>

                <label for="user-birthdate">Birthdate: </label><br>
                <input type="date" id="user-birthdate" name="user-birthdate"><br><br>

                <input type="submit" value="Submit"></input>
            </form>
        </div>
    </body>
</html>
