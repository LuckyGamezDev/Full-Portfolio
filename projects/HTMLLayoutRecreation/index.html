<!DOCTYPE html>
<html>
    <head>
        <title>Card Grid Layout</title>

        <style>
            body {
                background-color: rgb(199, 222, 249);
            }

            .card-container {
                display: grid;

                /* Make the grid have a max of 2 items in 1 row */
                grid-template-columns: auto auto; 

                background-color: rgb(101, 199, 175);

                justify-content: center;

                justify-self: center;

                border-radius: 30px;

                padding: 20px;
            }

            .card {
                display: flexbox;

                margin: 30px;

                padding: 20px 10px;

                justify-self: center
            }

            .card-top {
                display: flex;

                justify-content: space-between;

                flex-direction: column;
            }

            .card-bottom {
                justify-content: space-between;
            }

            .card-content {
                display: flex;

                flex-direction: column;

                align-items: space-between;

                justify-content: space-between;
            }

            .card-bg {
                .bg-image {
                    height: 100%;
                    object-fit: cover;
                    vertical-align: middle;
                }
            }
            
            .card-container img {
                background-color: rgb(146, 191, 230);
                padding: 10px;        

                transition: all 0.3s cubic-bezier(0.25, 0.45, 0.45, 0.95);

                border-radius: 25px;
                overflow: hidden;
            }

            .card-container img:hover {
                background-color: pink;
                transform: scale(1.02)
            }
        </style>
    </head>

    <body>
        <h1>Cards</h1>

        <div class="card-container">
            <div class="card">
                <div class="card-content">
                    <div class="card-top">
